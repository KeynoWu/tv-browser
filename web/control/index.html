<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b10">
<title>电视遥控</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SVG 图标库 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M9 3l3 3 3-3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5M5 10v10h14V10"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
</svg>

<!-- 品牌头部 -->
<header class="status-bar">
  <span class="brand-dot" aria-hidden="true"><svg class="icon lg"><use href="#i-tv"/></svg></span>
  <div class="brand-block">
    <div class="brand-name">电视遥控</div>
    <div class="brand-sub">TV Browser Remote</div>
  </div>
  <div class="status-info">
    <div class="status-title" id="statusTitle">未连接电视</div>
    <div class="status-url" id="statusUrl"></div>
  </div>
  <span class="status-dot" id="statusDot"></span>
</header>

<!-- 访问网址 -->
<section class="panel">
  <div class="section-title">访问网址</div>
  <div class="address-row">
    <input type="text" id="urlInput" placeholder="www.bilibili.com" autocomplete="off" enterkeyhint="go">
    <button id="btnOpen" aria-label="打开网址"><svg class="icon"><use href="#i-link"/></svg><span>打开</span></button>
    <button id="btnSearch" aria-label="搜索"><svg class="icon"><use href="#i-search"/></svg><span>搜索</span></button>
  </div>
</section>

<!-- 快捷入口 -->
<section class="panel">
  <div class="section-title">快捷入口</div>
  <div class="quick-sites" id="quickSites"></div>
</section>

<!-- 编辑快捷入口 -->
<section class="panel edit-panel" id="editPanel" hidden>
  <div class="section-title">编辑快捷入口</div>
  <div id="editList"></div>
  <button class="edit-add" id="editAdd"><svg class="icon"><use href="#i-plus"/></svg><span>添加一条</span></button>
  <div class="edit-actions">
    <button class="edit-save" id="editSave">保存</button>
    <button class="edit-cancel" id="editCancel">取消</button>
  </div>
</section>

<!-- 文字输入 -->
<section class="panel">
  <div class="section-title">文字输入</div>
  <div class="address-row">
    <input type="text" id="textInput" placeholder="先让电视页面聚焦输入框，再发送">
    <button id="btnSendText" aria-label="发送文字到电视"><svg class="icon"><use href="#i-send"/></svg><span>发送</span></button>
  </div>
</section>

<!-- 遥控器 -->
<section class="panel">
  <div class="section-title">遥控器</div>
  <div class="remote">
    <div class="dpad">
      <button class="key up" data-key="up" aria-label="上"><svg class="icon xl"><use href="#i-up"/></svg></button>
      <button class="key left" data-key="left" aria-label="左"><svg class="icon xl"><use href="#i-left"/></svg></button>
      <button class="key ok" data-key="ok" aria-label="确认"><svg class="icon xl"><use href="#i-ok"/></svg><span>OK</span></button>
      <button class="key right" data-key="right" aria-label="右"><svg class="icon xl"><use href="#i-right"/></svg></button>
      <button class="key down" data-key="down" aria-label="下"><svg class="icon xl"><use href="#i-down"/></svg></button>
    </div>
    <div class="side-keys">
      <button class="key wide" data-key="back" aria-label="返回"><svg class="icon"><use href="#i-back"/></svg><span>返回</span></button>
      <button class="key wide" data-key="menu" aria-label="菜单"><svg class="icon"><use href="#i-menu"/></svg><span>菜单</span></button>
      <button class="key wide" data-key="home" aria-label="主页"><svg class="icon"><use href="#i-home"/></svg><span>主页</span></button>
      <button class="key wide" data-key="refresh" aria-label="刷新"><svg class="icon"><use href="#i-refresh"/></svg><span>刷新</span></button>
    </div>
  </div>
</section>

<footer class="footer">长按方向键可连续移动 · 扫二维码即可连接电视</footer>

<script src="app.js"></script>
</body>
</html>
