<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电视浏览器主页</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#121212; color:#fff; font-family: sans-serif; overflow:hidden; }
  .wrap { width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4vh; }
  h1 { font-size:clamp(44px, 6.5vh, 96px); letter-spacing:0.2em; }
  .sub { font-size:clamp(22px, 3.2vh, 44px); color:#bbb; }
  .qr-box { text-align:center; }
  .qr-box img { width:34vh; height:34vh; min-width:280px; min-height:280px; background:#fff; padding:8px; border-radius:12px; }
  .qr-tip { margin-top:2vh; font-size:clamp(22px, 3.4vh, 44px); color:#4caf50; }
  .sites { display:flex; gap:2vw; margin-top:2vh; }
  .site {
    padding:2.2vh 2.6vw; background:#2a2a2a; border-radius:12px;
    font-size:clamp(22px, 3.4vh, 44px); text-decoration:none; color:#fff; outline:none;
    transition: background-color 0.2s ease;
  }
  .site:focus, .site:hover { background:#ff4081; color:#fff; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>电视浏览器</h1>
    <div class="sub">手机扫一扫 · 输网址 · 当遥控器</div>
    <div class="qr-box">
      <img src="/qr.png?t={token}" alt="扫码遥控" />
      <div class="qr-tip">手机浏览器扫码连接本机</div>
    </div>
    <div class="sites" id="sites">
      <a class="site" tabindex="0" href="https://www.bilibili.com">哔哩哔哩</a>
      <a class="site" tabindex="0" href="https://www.iqiyi.com">爱奇艺</a>
      <a class="site" tabindex="0" href="https://v.qq.com">腾讯视频</a>
      <a class="site" tabindex="0" href="https://www.youku.com">优酷</a>
      <a class="site" tabindex="0" href="https://tv.cctv.com/live">央视直播</a>
    </div>
  </div>
  <script>
    // 遥控器方向键焦点导航（左右移动，OK/Enter 打开）
    (function () {
      var sites = Array.prototype.slice.call(document.querySelectorAll('.site'));
      if (!sites.length) return;
      var idx = 0;
      function focusAt(i) {
        idx = (i + sites.length) % sites.length;
        sites[idx].focus();
      }
      document.addEventListener('keydown', function (e) {
        switch (e.key) {
          case 'ArrowLeft': e.preventDefault(); focusAt(idx - 1); break;
          case 'ArrowRight': e.preventDefault(); focusAt(idx + 1); break;
          case 'ArrowUp': case 'ArrowDown': e.preventDefault(); break;
        }
      });
      sites[0].focus();
    })();
  </script>
</body>
</html>
